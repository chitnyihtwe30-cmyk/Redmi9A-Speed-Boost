name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx2g

jobs:
  build:
    name: Build Redmi 9A Speed Boost APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verify project configuration
        run: |
          test -f gradle.properties
          test -f app/build.gradle
          test -f app/app/app/src/main/AndroidManifest.xml
          grep -E '^android\.useAndroidX=true$' gradle.properties

      - name: Build Debug APK
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Redmi9A-SpeedBoost-Premium
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
