plugins {
    id 'com.android.application'
}

android {
    namespace 'com.redmi9aspeedboost'
    compileSdk 35

    defaultConfig {
        applicationId "com.redmi9aspeedboost"
        minSdk 29
        targetSdk 29
        versionCode 1
        versionName "1.0"
    }

    sourceSets {
        main {
            manifest.srcFile 'app/app/src/main/AndroidManifest.xml'
            java.srcDirs = ['app/app/src/main/java']
            res.srcDirs = ['app/app/src/main/res']
        }
    }
}
