name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Enable AndroidX
        run: |
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

      - name: Check project
        run: |
          echo "===== CURRENT DIRECTORY ====="
          pwd
          echo "===== FILES ====="
          find . -maxdepth 5 -type f | sort | head -300
          echo "===== GRADLE FILES ====="
          find . -name "build.gradle" -o -name "settings.gradle" -o -name "gradle.properties"

      - name: Make Gradle executable
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Build Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace
          elif [ -f "./app/gradlew" ]; then
            cd app
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          else
            echo "ERROR: gradlew not found"
            exit 1
          fi

      - name: Find APK
        run: |
          echo "===== APK FILES ====="
          find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Redmi9A-SpeedBoost-debug
          path: |
            **/build/outputs/apk/debug/*.apk
